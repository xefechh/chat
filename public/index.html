<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Chat</title><style>body{font:16px system-ui;max-width:700px;margin:2rem auto;padding:0 1rem}#messages{min-height:20rem;border:1px solid #ddd;padding:1rem}form{display:flex;gap:.5rem;margin-top:1rem}input{padding:.6rem;flex:1}button{padding:.6rem 1rem}</style>
<h1>Global Chat</h1><div id="messages" aria-live="polite"></div>
<form><input id="text" maxlength="2000" required placeholder="Say something…"><button>Send</button></form>
<script>
const box=document.querySelector("#messages"), input=document.querySelector("#text");
function add(m){const p=document.createElement("p");p.textContent=`${m.displayName}: ${m.text}`;box.append(p)}
fetch("/api/messages").then(r=>r.json()).then(ms=>ms.forEach(add));
new EventSource("/api/events").onmessage=e=>add(JSON.parse(e.data));
document.querySelector("form").onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:input.value})});if(r.ok){input.value=""}else alert("Unable to send message")};
</script>
